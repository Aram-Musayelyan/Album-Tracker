<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K-pop Album Tracker</title>

    <style>
        html {
            scrollbar-gutter: stable;
        }
    
        .navbar-scroll {
            scrollbar-width: none;
        }
    
        .navbar-scroll::-webkit-scrollbar {
            display: none;
        }

        .navbar-link.active {
            font-weight: 700;
        }
    </style>

    

    <link rel="stylesheet" href="../design.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#ec4899">
    <link rel="icon" type="image/png" href="../Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body data-page="home" class="bg-gray-950 text-white min-h-screen">

    <nav id="nav" class="bg-gray-900 border-b border-gray-800 overflow-x-auto navbar-scroll">
    
        <div class="w-max min-w-full px-4 h-16 flex items-center gap-3">
    
            <img src="../Transparent Logo.png" alt="" class="w-14 h-14 object-contain">
    
            <h1 class="text-2xl font-bold text-[rgb(220,178,245)] mr-6 whitespace-nowrap flex-shrink-0">
                K-pop Album Tracker
            </h1>
    
            <a href="index.html" class="nav-button whitespace-nowrap flex-shrink-0">
                🏠 Home
            </a>
    
            <a href="albums.html" class="nav-button whitespace-nowrap flex-shrink-0">
                💿 Albums
            </a>
    
            <a href="favorites.html" class="nav-button whitespace-nowrap flex-shrink-0">
                ⭐ Favorites
            </a>
    
            <a href="balance.html" class="nav-button whitespace-nowrap flex-shrink-0">
                💰 Balance
            </a>
    
            <a href="affordables.html" class="nav-button whitespace-nowrap flex-shrink-0">
                🎯 Affordables
            </a>
    
            <a href="owned.html" class="nav-button whitespace-nowrap flex-shrink-0">
                📦 Owned
            </a>
    
            <a href="stores.html" class="nav-button whitespace-nowrap flex-shrink-0">
                🏪 Stores
            </a>
    
            <a href="calendar.html" class="nav-button whitespace-nowrap flex-shrink-0">
                📅 Calendar
            </a>
    
            <a href="https://chatgpt.com/share/6a7f2e86-de70-83eb-83cf-6f2c3431ccc1" target="_blank"
                class="nav-button whitespace-nowrap flex-shrink-0">
                ⚙️ ChatGPT
            </a>
    
            <button id="logout-button"
                class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-white font-bold whitespace-nowrap flex-shrink-0">
                Log out
            </button>
        </div>
    </nav>

    <section id="page-home" class="page">
    
        <h2 class="text-3xl font-bold mb-6">
            🏠 Dashboard
        </h2>
    
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    
            <!-- Balance -->
            <div data-page="balance"
                class="dashboard-card cursor-pointer bg-gray-900 border border-gray-700 rounded-2xl p-5 hover:border-pink-500 transition">
    
                <p class="text-gray-400">
                    💰 Balance
                </p>
    
                <p id="dashboard-balance" class="text-2xl font-bold mt-2">
                    ֏0
                </p>
    
            </div>
    
    
            <!-- Wishlist -->
            <div data-page="wishlist"
                class="dashboard-card cursor-pointer bg-gray-900 border border-gray-700 rounded-2xl p-5 hover:border-pink-500 transition">
    
                <p class="text-gray-400">
                    💿 Albums
                </p>
    
                <p id="dashboard-wishlist" class="text-2xl font-bold mt-2">
                    0 albums
                </p>
    
            </div>
    
            <!-- Favorites -->
            <div data-page="favorites"
                class="dashboard-card cursor-pointer bg-gray-900 border border-gray-700 rounded-2xl p-5 hover:border-pink-500 transition">
                <p class="text-gray-400">⭐ Favorites</p>
                <p id="dashboard-favorites" class="text-2xl font-bold mt-2">
                    0 albums
                </p>
            </div>
    
    
            <!-- Affordable -->
            <div data-page="affordables"
                class="dashboard-card cursor-pointer bg-gray-900 border border-gray-700 rounded-2xl p-5 hover:border-pink-500 transition">
    
                <p class="text-gray-400">
                    🎯 Affordable
                </p>
    
                <p id="dashboard-affordable" class="text-2xl font-bold mt-2">
                    0 albums
                </p>
    
            </div>
    
    
            <!-- Owned -->
            <div data-page="owned"
                class="dashboard-card cursor-pointer bg-gray-900 border border-gray-700 rounded-2xl p-5 hover:border-pink-500 transition">
    
                <p class="text-gray-400">
                    🛒 Owned
                </p>
    
                <p id="dashboard-owned" class="text-2xl font-bold mt-2">
                    0 albums
                </p>
    
            </div>
    
        </div>
    
    </section>

    <script src="../app.js"></script>

</body>

</html>
