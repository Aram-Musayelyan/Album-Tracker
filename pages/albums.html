<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Albums</title>
        
        <style>
            html {
                scrollbar-gutter: stable;
            }
        
            .navbar-scroll {
                scrollbar-width: none;
            }
        
            .navbar-scroll::-webkit-scrollbar {
                display: none;
            }

            .navbar-link.active {
                font-weight: 700;
            }
        </style>
        
        

    <link rel="stylesheet" href="../design.css">
    <link rel="manifest" href="../manifest.json">
        <meta name="theme-color" content="#ec4899">
        <link rel="icon" type="image/png" href="../Logo.png">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body data-page="albums" class="bg-gray-950 text-white min-h-screen">

        <nav id="nav" class="bg-gray-900 border-b border-gray-800 overflow-x-auto navbar-scroll">
        
            <div class="w-max min-w-full px-4 h-16 flex items-center gap-3">
        
                <img src="../Transparent Logo.png" alt="" class="w-14 h-14 object-contain">
        
                <h1 class="text-2xl font-bold text-[rgb(220,178,245)] mr-6 whitespace-nowrap flex-shrink-0">
                    K-pop Album Tracker
                </h1>
        
                <a href="index.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    🏠 Home
                </a>
        
                <a href="albums.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    💿 Albums
                </a>
        
                <a href="favorites.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    ⭐ Favorites
                </a>
        
                <a href="balance.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    💰 Balance
                </a>
        
                <a href="affordables.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    🎯 Affordables
                </a>
        
                <a href="owned.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    📦 Owned
                </a>
        
                <a href="stores.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    🏪 Stores
                </a>
        
                <a href="calendar.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    📅 Calendar
                </a>
        
                <a href="https://chatgpt.com/share/6a7f2e86-de70-83eb-83cf-6f2c3431ccc1" target="_blank"
                    class="nav-button whitespace-nowrap flex-shrink-0">
                    ⚙️ ChatGPT
                </a>
        
                <button id="logout-button"
                    class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-white font-bold whitespace-nowrap flex-shrink-0">
                    Log out
                </button>
            </div>
        
        </nav>

        <section id="page-wishlist" class="page">

            <h2 class="text-3xl font-bold mb-2">
                💿 Albums
            </h2>

            <p class="text-gray-400 mb-4">
                All the albums you wanna buy
            </p>

            <!-- Add album from URL -->
            <div class="mb-6">
                <div class="flex gap-3">
                    <input id="album-url-input" type="url" placeholder="🔗 Paste a Weverse or YG SELECT album URL..."
                        class="flex-1 px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 text-white placeholder-gray-500 outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 transition">
            
                    <button id="import-album-btn" type="button"
                        class="px-5 py-3 rounded-lg bg-pink-500 hover:bg-pink-600 text-white font-semibold transition">
                        Import
                    </button>
                </div>
            
                <p id="album-import-message" class="mt-2 text-sm text-gray-400"></p>
            </div>
            
            <!-- Imported album preview/edit modal -->
            <div id="album-import-modal"
                class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="w-full max-w-3xl max-h-[90vh] overflow-y-auto bg-gray-900 border border-gray-700 rounded-2xl p-6">
            
                    <!-- Preview -->
                    <div id="album-import-preview"></div>
            
                    <!-- Edit form -->
                    <div id="album-import-editor" class="hidden mt-6 space-y-4">
            
                        <div>
                            <label for="imported-album-name" class="block text-sm font-semibold text-gray-300 mb-2">
                                Album name
                            </label>
            
                            <input id="imported-album-name" type="text"
                                class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 text-white outline-none focus:border-pink-500">
                        </div>
            
                        <div>
                            <label for="imported-album-content" class="block text-sm font-semibold text-gray-300 mb-2">
                                Contents
                            </label>
            
                            <textarea id="imported-album-content" rows="6"
                                class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 text-white outline-none focus:border-pink-500"></textarea>
                        </div>
            
                        <div>
                            <label for="imported-album-delivery" class="block text-sm font-semibold text-gray-300 mb-2">
                                Delivery
                            </label>
            
                            <input id="imported-album-delivery" type="text" inputmode="decimal" value="0"
                                class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 text-white outline-none focus:border-pink-500">
                        </div>
            
                    </div>
            
                    <!-- Normal actions -->
                    <div id="album-import-actions" class="flex justify-end gap-3 mt-6">
                        <button id="cancel-import-album" type="button"
                            class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-white">
                            Cancel
                        </button>
            
                        <button id="edit-imported-album" type="button"
                            class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-white">
                            Edit
                        </button>
            
                        <button id="confirm-import-album" type="button"
                            class="px-4 py-2 rounded-lg bg-pink-500 hover:bg-pink-600 text-white font-semibold">
                            Add Album
                        </button>
                    </div>
            
                    <!-- Edit actions -->
                    <div id="album-import-save-actions" class="hidden flex justify-end gap-3 mt-6">
                        <button id="cancel-import-edit" type="button"
                            class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-white">
                            Cancel
                        </button>
            
                        <button id="save-imported-album" type="button"
                            class="px-4 py-2 rounded-lg bg-pink-500 hover:bg-pink-600 text-white font-semibold">
                            Save Changes
                        </button>
                    </div>
            
                </div>
            </div>

            <div id="albums-controls">
                <!-- Search -->
                <div class="mb-4">
                    <input id="album-search" type="text" placeholder="🔍 Search albums, artists, versions..."
                    class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 text-white placeholder-gray-500 outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 transition">
                </div>
                
                
                <!-- Sorting -->
                <div class="flex items-center gap-3 mb-6">
                
                    <label for="sort-albums" class="text-gray-300 font-semibold">
                        Sort:
                    </label>
                
                    <select id="sort-albums"
                        class="px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-white outline-none focus:border-pink-500 text-left leading-normal">
                        <option value="default">Default</option>
                        <option value="price-low">Price: Low → High</option>
                        <option value="price-high">Price: High → Low</option>
                        <option value="artist">A → Z</option>
                        <option value="artist-reverse">Z → A</option>
                        <option value="affordable">Affordable First</option>
                        <option value="favorites">Favorites First</option>
                    </select>
                </div>
            </div>


            <!-- Album grid -->
            <div
                id="albums-grid"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        </section>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../app.js"></script>
    </body>
</html>
