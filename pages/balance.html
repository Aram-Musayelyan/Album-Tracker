<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>Balance</title>
    
        <style>
            html {
                scrollbar-gutter: stable;
            }
    
            .navbar-scroll {
                scrollbar-width: none;
            }
    
            .navbar-scroll::-webkit-scrollbar {
                display: none;
            }

            .navbar-link.active {
                font-weight: 700;
            }
        </style>
        
        <link rel="stylesheet" href="../design.css">
        <link rel="manifest" href="../manifest.json">
        <meta name="theme-color" content="#ec4899">
        <link rel="icon" type="image/png" href="../Logo.png">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body data-page="balance" class="bg-gray-950 text-white min-h-screen">
        <nav id="nav" class="bg-gray-900 border-b border-gray-800 overflow-x-auto navbar-scroll">
        
            <div class="w-max min-w-full px-4 h-16 flex items-center gap-3">
        
                <img src="../Transparent Logo.png" alt="" class="w-14 h-14 object-contain">
        
                <h1 class="text-2xl font-bold text-[rgb(220,178,245)] mr-6 whitespace-nowrap flex-shrink-0">
                    K-pop Album Tracker
                </h1>
        
                <a href="index.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    🏠 Home
                </a>
        
                <a href="albums.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    💿 Albums
                </a>
        
                <a href="favorites.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    ⭐ Favorites
                </a>
        
                <a href="balance.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    💰 Balance
                </a>
        
                <a href="affordables.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    🎯 Affordables
                </a>
        
                <a href="owned.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    📦 Owned
                </a>
        
                <a href="stores.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    🏪 Stores
                </a>
        
                <a href="calendar.html" class="nav-button whitespace-nowrap flex-shrink-0">
                    📅 Calendar
                </a>
        
                <a href="https://chatgpt.com/share/6a7f2e86-de70-83eb-83cf-6f2c3431ccc1" target="_blank"
                    class="nav-button whitespace-nowrap flex-shrink-0">
                    ⚙️ ChatGPT
                </a>
        
                <button id="logout-button"
                    class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-white font-bold whitespace-nowrap flex-shrink-0">
                    Log out
                </button>
            </div>
        
        </nav>
        
        <section id="page-balance" class="page">
    
            <h2 class="text-3xl font-bold mb-2">
                💰 Balance
            </h2>
    
            <p class="text-gray-400 mb-4">
                Update your balance
            </p>
    
    
            <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-xl">
    
                <p class="text-gray-400">
                    Current balance
                </p>
    
                <p id="balance-display" class="text-4xl font-bold text-pink-500 mt-2">
                    ֏0
                </p>
    
                <div class="mt-4 space-y-4">
    
                    <!-- Money Received -->
                    <div>
                        <label class="block text-white font-bold mb-2">
                            💵 Money Received
                        </label>
    
                        <div class="flex gap-2">
                            <input type="text" id="money-received" placeholder="Amount received"
                                class="flex-1 px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-white">
                        </div>
                        <button type="button" id="add-money"
                            class="px-4 py-2 mt-3 rounded-lg bg-green-600 hover:bg-green-700 text-white font-bold transition">
                            + Add
                        </button>
                    </div>
    
                    <!-- Money Spent -->
                    <div>
                        <label class="block text-white font-bold mb-2">
                            💸 Money Spent
                        </label>
    
                        <div class="flex gap-2">
                            <input type="text" id="money-spent" placeholder="Amount spent"
                                class="flex-1 px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-white">
                        </div>
                        <button type="button" id="spend-money"
                            class="px-4 py-2 mt-3 rounded-lg bg-red-500 hover:bg-red-600 text-white font-bold transition">
                            − Spend
                        </button>
                    </div>
    
                </div>
    
            </div>
    
        </section>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../app.js"></script>
    </body>
</html>
