<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>Sign Up</title>
    
        <style>
            html {
                scrollbar-gutter: stable;
            }
    
            .navbar-scroll {
                scrollbar-width: none;
            }
    
            .navbar-scroll::-webkit-scrollbar {
                display: none;
            }

            .navbar-link.active {
                font-weight: 700;
            }
        </style>
    
        

    <link rel="stylesheet" href="../design.css">
    <link rel="manifest" href="../manifest.json">
        <meta name="theme-color" content="#ec4899">
        <link rel="icon" type="image/png" href="../Logo.png">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body data-page="signup" class="bg-gray-950 text-white min-h-screen">
        <div id="register-form">
    
            <h2 class="text-xl font-bold text-white mb-4">
                Create account
            </h2>
    
            <input id="register-username" type="text" placeholder="Username"
                class="w-full mb-3 p-3 rounded-lg bg-gray-800 text-white">
    
            <input id="register-password" type="password" placeholder="Password"
                class="w-full mb-3 p-3 rounded-lg bg-gray-800 text-white">
    
            <input id="register-password-confirm" type="password" placeholder="Confirm password"
                class="w-full mb-3 p-3 rounded-lg bg-gray-800 text-white">
    
            <button id="register-button"
                class="w-full px-4 py-3 rounded-lg bg-pink-500 hover:bg-pink-600 text-white font-bold">
                Create account
            </button>
    
            <p id="register-message" class="text-red-400 text-center mt-3"></p>
    
            <button id="show-login" class="w-full mt-4 text-pink-400 hover:text-pink-300">
                Already have an account? Log in
            </button>
    
        </div>
        
        <script src="../app.js"></script>
    </body>
</html>
